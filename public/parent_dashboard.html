<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Dashboard | Little Steps</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="navbar"></div>

  <section class="page-title">
    <div class="container">
      <h1 id="welcome">My Dashboard</h1>
      <p id="summary">Your children and the activities you have done</p>
    </div>
  </section>

  <main class="section bg-cream">
    <div class="container">
      <h2>My children</h2>
      <!-- Child cards are added here by parent_dashboard.js -->
      <div class="grid" id="children-list"></div>
      <p><a class="btn btn-yellow" href="parent_child.html">+ Add a child</a></p>

      <h2 style="margin-top:36px">Activities done</h2>
      <!-- The table of finished activities is added here -->
      <div id="logs-area"></div>

      <div class="disclaimer">
        This page is only a simple record for you. It is not a medical report. Please share any concerns about your child with a qualified doctor or therapist.
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/parent_dashboard.js"></script>
</body>
</html>
