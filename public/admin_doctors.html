<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Doctors | Little Steps</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="navbar"></div>

  <section class="page-title">
    <div class="container">
      <h1>Manage Doctors</h1>
      <p>Add, change or remove doctors and therapists</p>
    </div>
  </section>

  <main class="container section">

    <!-- Table of doctors is added here by admin_doctors.js -->
    <div id="doctor-table"></div>

    <div class="form-box">
      <h2 id="form-title">Add a doctor</h2>

      <form id="doctor-form">
        <div class="form-row">
          <div>
            <label for="name">Name</label>
            <input type="text" id="name">
          </div>
          <div>
            <label for="specialty">Type</label>
            <select id="specialty"></select>
          </div>
          <div>
            <label for="city">City</label>
            <input type="text" id="city">
          </div>
          <div>
            <label for="mode">Meeting</label>
            <select id="mode">
              <option value="In person">In person</option>
              <option value="Online">Online</option>
              <option value="Online and in person">Online and in person</option>
            </select>
          </div>
          <div>
            <label for="phone">Phone</label>
            <input type="text" id="phone">
          </div>
          <div>
            <label for="fee">Fee (Rs)</label>
            <input type="number" id="fee" min="0">
          </div>
          <div>
            <label for="experience">Years of experience</label>
            <input type="number" id="experience" min="0">
          </div>
          <div>
            <label for="address">Address</label>
            <input type="text" id="address">
          </div>
        </div>

        <label for="bio">Short bio</label>
        <textarea id="bio"></textarea>

        <div class="btn-row">
          <button class="btn btn-blue" type="submit">Save doctor</button>
          <button class="btn btn-outline" type="button" id="cancel-btn">Clear form</button>
        </div>
      </form>

      <!-- Success or error message appears here -->
      <div id="form-message"></div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/admin_doctors.js"></script>
</body>
</html>
