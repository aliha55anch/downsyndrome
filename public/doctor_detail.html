<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doctor Profile | Little Steps</title>
</head>
<body>
  <p id="message">Opening the published doctor profile…</p>
  <script>
    const id = new URLSearchParams(window.location.search).get('id');
    if (/^[1-9][0-9]*$/.test(id || '')) {
      window.location.replace('/doctors/' + encodeURIComponent(id));
    } else {
      document.getElementById('message').innerHTML = 'Choose a real, published doctor from the <a href="/doctors">doctor directory</a>.';
    }
  </script>
  <noscript><p><a href="/doctors">Open the live doctor directory</a>.</p></noscript>
</body>
</html>
