<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account | Little Steps</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="navbar"></div>

  <main class="container section">
    <div class="form-box form-narrow">
      <h2 class="center">Create a free account</h2>
      <p class="center muted">For parents and caregivers</p>

      <form id="register-form">
        <label for="name">Your name</label>
        <input type="text" id="name" placeholder="Your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 letters or numbers">

        <label for="password2">Write the password again</label>
        <input type="password" id="password2" placeholder="Same password">

        <button class="btn btn-yellow" type="submit" style="width:100%">Create account</button>
      </form>

      <!-- Error message appears here -->
      <div id="form-message"></div>

      <p class="center" style="margin-top:16px">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/register.js"></script>
</body>
</html>
