<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Child Profile | Little Steps</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="navbar"></div>

  <main class="section bg-cream">
    <div class="container">
      <a class="back-link" href="parent_dashboard.html">← Back to my dashboard</a>

      <div class="form-box form-narrow">
        <h2 id="form-title">Add a child</h2>

        <form id="child-form">
          <label for="name">Child's name</label>
          <input type="text" id="name" placeholder="Name">

          <label for="dob">Date of birth</label>
          <input type="date" id="dob">
          <p class="hint">We use this to show activities that suit your child's age.</p>

          <button class="btn btn-yellow" type="submit" style="width:100%">Save</button>
        </form>

        <!-- Error message appears here -->
        <div id="form-message"></div>
      </div>
    </div>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/parent_child.js"></script>
</body>
</html>
