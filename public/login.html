<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Little Steps</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="navbar"></div>

  <main class="container section">
    <div class="form-box form-narrow">
      <h2 class="center">Welcome back 👋</h2>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="name@example.com">

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Your password">

        <button class="btn btn-blue" type="submit" style="width:100%">Login</button>
      </form>

      <!-- Error message appears here -->
      <div id="form-message"></div>

      <p class="center" style="margin-top:16px">New here? <a href="register.html">Create a free account</a></p>
    </div>

    <p class="center muted" style="margin-top:20px">
      For testing, the admin login is admin@example.com and admin123.
    </p>
  </main>

  <div id="footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/login.js"></script>
</body>
</html>
